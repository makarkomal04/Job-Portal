<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Apply for Job</h2>
        <form action="SubmitApplication" method="post">
            <input type="hidden" name="companyId" id="companyId" value="1">
            <input type="hidden" name="jobTitle" id="jobTitle" value="Software Engineer">

            <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" name="fullName" id="fullName" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" name="email" id="email" required>
            </div>

            <div class="mb-3">
                <label for="resume" class="form-label">Resume (URL or Upload)</label>
                <input type="file" class="form-control" name="resume" id="resume" required>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Cover Letter</label>
                <textarea class="form-control" name="message" id="message" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Submit Application</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Add New Job</h2>
        <form action="AddJob" method="post">
            <div class="mb-3">
                <label class="form-label">Company ID</label>
                <input type="number" class="form-control" name="companyId" id="companyId" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Job Title</label>
                <input type="text" class="form-control" name="jobTitle" id="jobTitle" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Job Type</label>
                <select class="form-select" name="jobType" id="jobType" required>
                    <option value="full_time">Full-Time</option>
                    <option value="part_time">Part-Time</option>
                    <option value="contract">Contract</option>
                    <option value="freelance">Freelance</option>
                    <option value="internship">Internship</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" class="form-control" name="location" id="location">
            </div>
            <div class="mb-3">
                <label class="form-label">Salary Range</label>
                <input type="text" class="form-control" name="salaryRange" id="salaryRange">
            </div>
            <div class="mb-3">
                <label class="form-label">Job Description</label>
                <textarea class="form-control" name="description" id="description" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Requirements</label>
                <textarea class="form-control" name="requirements" id="requirements"></textarea>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="isRemote" id="isRemote" value="yes">
                <label class="form-check-label">Remote Job</label>
            </div>
            <button type="submit" class="btn btn-primary">Post Job</button>
        </form>
    </div>
</body>
</html>
